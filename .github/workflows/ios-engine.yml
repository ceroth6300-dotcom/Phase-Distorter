
name: Phase Distorter iOS Engine Stage 2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-engine.yml"

jobs:
  compile-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          test -f cpp/CMakeLists.txt
          test -f generated/program_sources.cmake
          test -f generated/game_runtime_sources.cmake
          xcodebuild -version

      - name: Configure iOS engine
        run: |
          cmake -S . -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DEB_BUILD_FRONTEND=OFF \
            -DEB_BUILD_TESTS=OFF

      - name: Compile all engine libraries
        shell: bash
        run: |
          mkdir -p ios-report
          set -o pipefail

          for LIB in eb_scene eb_assets eb_filter eb_native_engine eb_session; do
            echo "Building $LIB"
            cmake --build build/ios \
              --config Release \
              --target "$LIB" \
              --parallel 2 2>&1 | tee -a ios-report/build.log
          done

      - name: Inspect built libraries
        if: success()
        run: |
          find build/ios -type f -name '*.a' \
            -print | tee ios-report/libraries.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-stage2-engine-report
          path: ios-report/
          if-no-files-found: warn
